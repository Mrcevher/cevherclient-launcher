// Karartma (ProGuard): oturum modu sınıf/metot adları anlamsızlaştırılır; hile yazarının modu okuyup
// sorgu yanıtını taklit etmesi zorlaşır. Mixin sınıfları ve giriş noktası adları korunur (Fabric/Mixin
// bunları adlarıyla bulur). Yalnızca zorlaştırır; asıl karar sunucudadır.
buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath 'com.guardsquare:proguard-gradle:7.6.1'
	}
}

// Cevherclient oturum modu — yalnızca istemci tarafı, Fabric API gerektirmez (sadece mixin).
plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = "cevher-session-${project.minecraft_version}"
}

loom {
	runs {
		// Elle test (./gradlew runClient): oyun kimsenin dinlemediği bir adrese Quick Play ile
		// bağlanmayı dener; hata ekranında "Geri"ye basınca ana menü yerine oyun kapanmalı.
		client {
			vmArg '-Dcevherclient.exitOnLeave=true'
			// Farklı sunucu için: ./gradlew runClient -PtestServer=localhost:25565
			programArgs '--quickPlayMultiplayer', (project.findProperty('testServer') ?: 'localhost:25599').toString()
		}
		// Uçtan uca test için yerel sunucu (./gradlew runServer). run-server/server.properties
		// içinde online-mode=false ve server-port=25599 olmalı; istemci buna bağlanır.
		server {
			runDir 'run-server'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	def props = [version: project.version, minecraft_version: project.minecraft_version]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// remapJar çıktısı karartılır ve aynı adla build/libs'e geri yazılır (scripts/build-session-mod.mjs onu kopyalar).
tasks.register('karart', proguard.gradle.ProGuardTask) {
	dependsOn remapJar
	def girdi = remapJar.archiveFile.get().asFile
	def ara = layout.buildDirectory.file("karart/acik.jar").get().asFile
	def cikti = layout.buildDirectory.file("karart/kapali.jar").get().asFile
	doFirst {
		ara.parentFile.mkdirs()
		java.nio.file.Files.copy(girdi.toPath(), ara.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
	}
	injars ara
	outjars cikti
	libraryjars "${System.getProperty('java.home')}/jmods/java.base.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
	libraryjars "${System.getProperty('java.home')}/jmods/java.management.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
	dontshrink
	dontoptimize
	ignorewarnings
	dontwarn
	dontnote
	keepattributes '*Annotation*,Signature,InnerClasses,EnclosingMethod,Exceptions'
	keep 'class net.cevherclient.session.mixin.** { *; }'
	keep 'class net.cevherclient.session.CevherSessionInit { public <init>(); public void onInitializeClient(); }'
	repackageclasses 'net.cevherclient.session.x'
	overloadaggressively
	doLast {
		java.nio.file.Files.copy(cikti.toPath(), girdi.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
	}
}
build.dependsOn karart
