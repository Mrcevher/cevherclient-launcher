name: CevherAuth
version: '${version}'
main: net.cevherclient.auth.CevherAuthPlugin
api-version: '1.21'
description: Cevherclient launcher hesapları — launcher ile gelen şifresiz girer; lobi rolünde launcher kullanmayan oyunda /login veya /register yapar.
authors: [Cevherclient]
commands:
  cevherauth:
    description: CevherAuth hesap yönetimi
    usage: /cevherauth <liste|sil|sifre|kayit|reload>
    permission: cevherauth.admin
permissions:
  cevherauth.admin:
    description: CevherAuth yönetim komutları
    default: op
  cevherauth.risk:
    description: Risk listesini (sağ üst ekran ve sohbet uyarıları) görür
    default: op
  # Lobi rolünde oyuncunun giriş durumu (TAB gibi eklentilerin koşulları için; CevherAuth verir).
  cevherauth.bekliyor:
    description: Henüz giriş yapmadı
    default: false
  cevherauth.bekliyor.giris:
    description: Hesabı var, /login bekleniyor
    default: false
  cevherauth.bekliyor.kayit:
    description: Hesabı yok, /register bekleniyor
    default: false
  cevherauth.kayitli:
    description: Hesabı var
    default: false
