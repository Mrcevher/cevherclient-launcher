# CevherAuth — Cevherclient launcher hesapları
#
# Oyuncu hesabını launcher'da açar / launcher'da giriş yapar; oyunda şifre sorulmaz.
# Oyna'ya basıldığında launcher bu eklentiden tek kullanımlık bir "giriş bileti" alır;
# oyuncu sunucuya bağlanırken bilet kontrol edilir. Bileti olmayan (launcher kullanmayan)
# kimse sunucuya giremez, böylece lisanssız sunucuda başkasının adıyla girilemez.

# Bu sunucunun rolü:
#   standalone : Tek sunucu. Launcher'sız (biletsiz) gelen sunucuya giremez.
#   lobby      : Velocity'nin ilk sunucusu (çakma lobi). Cevherclient ile gelen şifresiz girer;
#                gelmeyen lobide /login <şifre> veya /register <şifre> <şifre> yapar (launcher
#                hesabıyla aynı şifre). Hesaplar ve launcher API'si bu sunucuda durur.
#   gate       : Arka sunucu (survival). Yalnızca lobide giriş yapmış oyuncuları alır; hesap
#                dosyası tutmaz, launcher API'si açmaz. network.* lobideki ile aynı olmalı.
role: standalone

# Lobi ile kapı (survival) arasındaki bağ. İki sunucu aynı bilgisayarda olmalı.
network:
  # Ortak sır. Lobi ilk açılışta boşsa üretir; aynı değeri survival config'ine yazın.
  secret: ""
  # (gate) Lobideki CevherAuth API'sinin yerel adresi.
  lobby-api: "http://127.0.0.1:25580"

# (lobby) Launcher'sız gelen oyuncular için oyun içi giriş.
in-game-login:
  # Bu sürede giriş yapmayan atılır (saniye).
  timeout-seconds: 90
  # Bu kadar yanlış şifreden sonra atılır.
  max-attempts: 5
  # Launcher'sız oyuncular oyunda /register ile hesap açabilsin mi?
  allow-register: true
  # Girişten sonra oyuncuyu otomatik gönder (Velocity sunucu adı, ör. survival). Boş = gönderme.
  send-to-server: ""
  send-delay-ticks: 40
  # Daha önce oynamış adlar oyunda /register ile alınamasın mı? Lisanssız sunucuda eski oyuncuların
  # çoğunun hesabı yoktur; true yapılırsa bu oyuncuların hesabını yönetici açmak zorunda kalır.
  # (Op adları her zaman korunur: onların hesabı konsoldan /cevherauth kayit ile açılır.)
  protect-played-names: false

# Korunan "oynamış" adları için ek kaynaklar (usercache.json biçimi; sunucu klasörüne göre ya da tam yol).
# Lobide yalnızca bunlar okunur; ör. "C:/Users/Administrator/Desktop/Klasor_01/usercache.json"
played-name-sources: []
# Op adları için ek kaynaklar (ops.json biçimi). Lobide ana sunucunun ops.json'unu verin: oradaki
# yönetici adlarıyla kimse lobide kayıt olup ana sunucuya op olarak giremesin.
op-name-sources: []

http:
  # Launcher'ın bağlanacağı adres ve port. Başka bilgisayarlardan girilecekse bu port da
  # (Minecraft portu gibi) modemde yönlendirilmeli ve launcher config'indeki authServerUrl
  # buna göre yazılmalı.
  bind: 0.0.0.0
  port: 25580
  # Sunucu bir reverse proxy (nginx, Caddy, Cloudflare) arkasındaysa true:
  # oyuncu IP'si X-Forwarded-For başlığından okunur. Doğrudan açıksa false bırakın.
  trust-proxy-headers: false
  # Proxy başlıkları (X-Forwarded-For) yalnızca bağlantıyı bu adreslerden gelen proxy'ler
  # kurduysa dikkate alınır. Boş bırakılırsa yalnızca yerel makine (127.0.0.1, ::1) güvenilir.
  trusted-proxies:
    - 127.0.0.1
    - "::1"
  # Aynı istemciden aynı anda açık tutulabilecek en fazla bağlantı.
  max-connections-per-ip: 6

# Launcher'dan gelmeyen (bileti olmayan) oyuncuları sunucuya alma.
require-launcher: true
# Oyuna bağlanan istemci, bileti alan launcher olduğunu kanıtlamalı mı? Launcher her bilet için
# bir sır alır ve oyuna (Cevherclient oturum modu) verir; oyun bağlanırken bu sırla kanıt üretir.
# Kapatılırsa adı bilen ve aynı IP'yi paylaşan (check-ip: false ise herhangi biri) bilet
# penceresinde başkasının adıyla girebilir. Yalnızca eski launcher'larla geçiş döneminde kapatın.
require-proof: true
# Bileti alan IP ile oyuna bağlanan IP aynı olmalı mı? Ek bir kontroldür; asıl bağ require-proof'tur.
# (playit.gg gibi IP'yi değiştiren bir tünel kullanıyorsanız false yapın; require-proof açık kalsın.)
# Launcher API'si Cloudflare Tunnel gibi bir HTTP proxy'sinin arkasındaysa da false yapın: oyuncunun
# interneti IPv6 kullanıyorsa bilet IPv6, Minecraft bağlantısı IPv4 adresiyle görünür ve eşleşmez.
check-ip: true

# Launcher oturumu kaç gün geçerli (her Oyna'da yenilenir). Süre dolunca launcher şifre sorar.
session-days: 30
# Oyna'ya basıldıktan sonra oyunun açılıp sunucuya bağlanması için süre (saniye).
ticket-seconds: 300
# Bilet kullanıldıktan sonra aynı oyunun Oyna'ya basmadan "Yeniden Bağlan" ile girebildiği süre
# (saniye). -1 = süresiz: oyun açık kaldıkça (sunucu yeniden başlasa da) geçerli; oyuncu Oyna'ya
# yeniden basınca ya da şifresi değişince biter. Kanıt yine istenir: bilet sırrı yalnızca o oyundadır.
# 0 = kapalı.
reconnect-grace-seconds: -1

password:
  min-length: 6
  max-length: 64
# Aynı IP'den en fazla kaç hesap açılabilir (0 = sınırsız).
max-accounts-per-ip: 3
# Aynı (IP, kullanıcı adı) çiftinden 10 dakikada izin verilen hatalı şifre denemesi.
# Aynı IP'den tüm hesaplara ve aynı hesaba tüm IP'lerden bunun 3 katı uygulanır.
max-failed-logins: 10
# Bir IP'den 10 dakikada denenebilecek kayıt sayısı (yerel makine hariç).
max-registrations-per-10min: 5
# Hesap başına aynı anda açık tutulan en fazla launcher oturumu (eskisi silinir).
max-sessions-per-account: 10
# IP başına 10 dakikada izin verilen biletsiz/eşleşmeyen sunucu bağlantı denemesi.
max-ticket-misses: 20

# Yönetici (op) adlarıyla yalnızca sunucunun çalıştığı bilgisayardan (aracısız, tarayıcı
# olmayan bağlantı) kayıt olunabilir; başkası "arda" gibi yönetici adlarını sizden önce kapamaz.
protect-op-names: true
# Sunucuda daha önce oynamış oyuncuların adları da aynı şekilde korunur (ilk gelen kapmasın).
# Bu oyuncular için hesabı /cevherauth kayit <ad> <sifre> ile siz açın.
protect-played-names: true

# Sunucunun kaynak paketi launcher'da önceden kurulsun: launcher Oyna'da paketi indirip
# etkinleştirir, oyun sunucu paketi gönderdiğinde onay ekranı göstermez ve aynı paketi
# yeniden yüklemez (girişte kasma olmaz). Paket değişince launcher bir sonraki Oyna'da yenisini indirir.
resource-pack:
  enabled: false
  # Sunucuya gönderilen paket dosyası (sunucu klasörüne göre). Nexo: plugins/Nexo/pack/pack.zip
  file: plugins/Nexo/pack/pack.zip
  # Launcher'ın paketi indireceği adres; {sha1} dosyanın SHA-1'iyle değiştirilir.
  # Nexo + Polymath: https://atlas.nexomc.com/pack.zip?id={sha1}
  url: "https://atlas.nexomc.com/pack.zip?id={sha1}"

# LeaderOS web sitesi ile hesap senkronu.
# - Launcher'dan kayıt olan oyuncunun sitede de aynı ad ve şifreyle hesabı açılır.
# - Sitede kayıt olan oyuncu, site şifresiyle launcher'a giriş yapabilir (launcher hesabı o an açılır).
# - Senkrondan önce açılmış launcher hesapları, oyuncu launcher'a ilk giriş yaptığında siteye aktarılır.
# Site erişilemezse launcher normal çalışır; eksik site hesabı sonraki girişte açılır.
leaderos:
  enabled: false
  # Sitenin adresi (sonunda / olmadan). Örnek: https://cevhercraft.com
  url: ""
  # Site > Yönetim Paneli > Ayarlar > API sayfasındaki anahtar.
  api-key: ""
  # Siteye yapılan isteklerin zaman aşımı (saniye).
  timeout-seconds: 8

# Launcher içi Mağaza ve Profil (site kredisi, siparişler). leaderos.* açık olmalı.
# Satın alma, launcher hesabıyla eşleşmiş (aynı ad + şifre) site hesabının kredisiyle yapılır;
# site API anahtarı yalnızca bu eklentide durur, launcher'a hiç gönderilmez.
store:
  enabled: true
  # Hesap başına 10 dakikada en fazla satın alma denemesi.
  max-purchases-per-10min: 15

# ── Saldırı korumaları (1.4.0; 2026-11-19 saldırısından) ─────────────────────
# Her rolde (lobi, kapı, standalone) çalışır.
guvenlik:
  # Aynı IP'den aynı anda bu sunucuda en fazla kaç hesap olabilir (0 = sınırsız).
  # Saldırgan aynı IP'den 6 hesapla geldi. Mobil internette (CGNAT) farklı kişiler aynı IP'yi
  # paylaşabilir; şikâyet gelirse artırın ya da IP'yi ip-muaf listesine ekleyin.
  ip-basina-online: 3
  # Bu IP'lere online sınırı ve IP engeli uygulanmaz.
  ip-muaf: []
  ip-engeli:
    enabled: true
    # Engel süresi (dakika).
    sure-dakika: 10
    # 10 dakikada bu kadar güvenlik nedenli atılma olursa IP engellenir.
    ihlal-esigi: 2
    # Güvenlik nedenli sayılan Paper atılma nedenleri.
    kick-sebepleri:
      - INVALID_PAYLOAD
      - ILLEGAL_ACTION
      - ILLEGAL_CHARACTERS
      - TOO_MANY_PENDING_CHATS
      - INVALID_ENTITY_ATTACKED
      - SELF_INTERACTION
      - SPAM
    # Atılma mesajı bunlardan birini içeriyorsa da sayılır (küçük/büyük harf fark etmez).
    # CevherPaketKalkan'ın at-mesaji burada olmalı.
    kick-mesajlari:
      - "geçersiz paket gönderdin"
  # Kendini client brand, kayıtlı kanal ya da custom click kimliğiyle belli eden hile istemcileri.
  hile-istemcisi:
    enabled: true
    # Tespit edilen IP'yi hemen ip-engeli.sure-dakika boyunca engelle.
    ip-engelle: true
    # Client brand bunlardan birini içeriyorsa.
    brand: [autismclient, xynisclient, meteor, wurst, liquidbounce, aristois, bleachhack, thunderhack, rusherhack, boze]
    # Kayıtlı kanalın namespace'i (":" öncesi) bunlardan biriyse.
    kanallar: [autismclient, xynisclient, meteor-client, wurst, liquidbounce, aristois, bleachhack, thunderhack, rusherhack, boze]
    # Custom click (dialog) kimliğinin namespace'i bunlardan biriyse.
    custom-click: [autismclient, xynisclient]

# (lobby / standalone) Launcher'la gelen oyunun yüklü modlarının HASH denetimi.
# Cevherclient (cevher-session 1.1+) her modun jar SHA-1'ini bilet kanıtına ekler. Karar dosya adına
# ya da mod kimliğine göre verilmez: hile modunun adını/kimliğini değiştiren araçlar jar'ın hash'ini de
# değiştirir. Bir jar yalnızca hash'i izinli-hashler / jar-klasorleri / modpack-dosyalari içinde ya da
# Modrinth'te yayımlanmış değiştirilmemiş bir sürümse geçer. Launcher aynı politikayı /api/mod-policy'den
# alıp oyunu açmadan önce izinsiz jar'ları karantinaya taşır.
# Sınır: liste istemciden gelir; oturum modunu bilerek değiştiren biri yalan söyleyebilir.
mod-dogrulama:
  enabled: true
  # Mod listesi göndermeyen (eski launcher) oyuncu reddedilsin mi? Herkes 5.0.5+'a geçince true yapın.
  liste-zorunlu: false
  hash-kontrol: true
  # Hash'i hiçbir listede olmayan jar: REDDET | KAYDET (yalnızca konsola yazar, girişe izin verir)
  bilinmeyen: REDDET
  # Bilinmeyen hash'leri Modrinth'te ara (Mod Ara / Performans Paketi modları buradan gelir).
  modrinth-kontrol: true
  # Modrinth'e ulaşılamazsa bilinmeyen hash'ler: GECIR | REDDET
  modrinth-erisilemezse: REDDET
  # Oyuna -javaagent ile kod enjekte edilmişse reddet.
  agent-reddet: true
  # Bu klasörlerdeki jar'ların hash'i izinlidir. Launcher'ın kendi modları (cevher-session/client/ui):
  # her launcher sürümü yayınlanınca resources/mods içindeki jar'ları buraya kopyalayıp /cevherauth reload.
  jar-klasorleri:
    - "plugins/CevherAuth/izinli-jarlar"
  # .mrpack dosyaları (modrinth.index.json hash'leri + overrides jar'ları izinli sayılır).
  modpack-dosyalari: []
  izinli-hashler: []
  yasakli-hashler: []
  # Modrinth proje kimlikleri (ör. "XeEZ3fK2"): hash'i Modrinth'te olsa da reddedilir.
  yasakli-projeler: []
  # Her oyuncunun mod listesi (değiştiğinde) konsola yazılsın.
  kaydet: true
  # Mod kimliği yasağı (kimlik değiştirilebildiği için yalnızca ek önlem; asıl koruma hash'tir).
  yasakli: [meteor-client, wurst, liquidbounce, aristois, bleachhack, thunderhack, rusherhack, boze, autismclient, xynisclient, inertia, coffee]
  # KRİTİK hile kelimeleri: hash'i hiçbir listede olmayan bir modun kimliğinde bu kelimelerden biri
  # geçerse giriş reddedilir ve IP guvenlik.ip-engeli.sure-dakika boyunca engellenir. Bitişik yazım da
  # sayılır ("killaura" → aura, "thunderhack" → hack); lua, ares, exec, jex, sigma yalnızca tam kelimeyken
  # ("squares" içindeki ares sayılmaz). Modrinth'te doğrulanan modlara uygulanmaz (Better Combat gibi).
  hile-kelimeleri: [hack, hile, cheat, injector, trigger, lua, wurst, aristois, meteor, ares, combat, mathax, vape, jex, liquidbounce, trainer, bleachhack, hacked, aura, impactclient, doomsday, sigma, exec]

# Oyuncu risk takibi (1.5.0): launcher karantinası, mod doğrulama, hile istemcisi, güvenlik atmaları ve
# Vulcan işaretleri tek defterde toplanır; oyuncular KRİTİK / YÜKSEK / ORTA / DÜŞÜK sınıflarına ayrılır.
# Sınıf yükseldiğinde konsola [RİSK] uyarısı yazılır. OP'lar (ya da cevherauth.risk izni olanlar)
# cevher_client modu varsa listeyi ekranın sağ üstünde görür. Komut: /cevherauth risk [ad]
risk-takibi:
  enabled: true
  # Bulguların sınıfa sayıldığı süre (saat). Kayıtlar 7 gün saklanır (plugins/CevherAuth/risk.json).
  sure-saat: 24
  # YÜKSEK ve KRİTİK'e çıkan oyuncu OP'lara sohbetten de bildirilsin.
  op-sohbet-uyarisi: true
  vulcan:
    enabled: true
    # Penceredeki işaret puanı eşikleri (savaş kontrolleri savas-carpani kadar sayılır).
    pencere-dakika: 10
    dusuk: 3
    orta: 15
    yuksek: 40
    savas-carpani: 2

# Kalıcı yasak (CevherKoruma "Hileydi → Onayla" ve /cevherauth yasakla). Yasak hesap adı, IP, Cevherclient'ın
# gönderdiği cihaz izi (bilgisayar kimliği) ve bilgisayara yazılan damga ile eşleşir; eşleşen yeni hesap/IP yasağa eklenir.
kalici-yasak:
  # IP de yasaklansın mı (aynı internetteki herkes etkilenir; mobil/paylaşımlı IP'de dikkat)
  ip: true
  # Yasaklı IP'den/bilgisayardan gelen başka hesaplar da yasağa eklensin mi
  bagli-hesaplar: true
  # Yasak ekranında gösterilen itiraz adresi (boşsa gösterilmez)
  itiraz-adresi: "cevhercraft.com/ban-itiraz"
  # Sitenin itiraz formunun API'ye istek atabileceği kökenler (tarayıcı CORS)
  itiraz-originler:
    - "https://cevhercraft.com"
    - "https://www.cevhercraft.com"

